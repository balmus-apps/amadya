name: amadya

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20


  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      AMADYA_DOMAIN: ${AMADYA_DOMAIN}
      AMADYA_LAN_SITE: ${AMADYA_LAN_SITE:-http://lan.localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_HOST: postgres
      DB_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      AMADYA_PUBLIC_URL: https://${AMADYA_DOMAIN}
      AMADYA_ADMIN_EMAIL: ${AMADYA_ADMIN_EMAIL}
      AMADYA_ADMIN_PASSWORD: ${AMADYA_ADMIN_PASSWORD}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PRINTING_MODE: ${PRINTING_MODE:-log}
      MEDIA_PROVIDER: ${MEDIA_PROVIDER:-filesystem}
      MEDIA_DIR: /var/lib/amadya/files
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_BUCKET: ${S3_BUCKET:-amadya}
    volumes:
      - mediadata:/var/lib/amadya/files
    ports:
      - "${API_PORT:-8080}:8080"

  menu-web:
    build:
      context: ./frontend
      dockerfile: apps/menu-web/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_INTERNAL_URL: http://api:8080

  admin:
    build:
      context: ./frontend
      dockerfile: apps/admin/Dockerfile
    restart: unless-stopped

  kitchen:
    build:
      context: ./frontend
      dockerfile: apps/kitchen/Dockerfile
    restart: unless-stopped

  # --- Added per phase ---
  # waiter:         (Phase 4)
  # queue-display:  (Phase 5)

volumes:
  pgdata:
  mediadata:
  caddydata:
