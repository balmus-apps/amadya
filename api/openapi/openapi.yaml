      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NirRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nir" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/nirs/{id}:
    get:
      tags: [procurement]
      operationId: getNir
      summary: Get a NIR
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nir" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [procurement]
      operationId: updateNir
      summary: Replace a draft NIR (header and lines)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NirRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nir" }
