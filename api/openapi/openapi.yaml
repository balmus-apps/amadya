openapi: 3.1.0
info:
  title: Amadya Core API
  version: 0.2.0
  license:
    name: Proprietary
    identifier: LicenseRef-Proprietary
  description: |
    Contract-first API for the Amadya HoReCa platform (see docs/adr/0002-contract-first-openapi.md).
    Localized content is resolved using the `Accept-Language` header (`ro`, `en`; default from settings).
    Errors use RFC 9457 problem+json with a stable `code`.

    Tags `streams` (Server-Sent Events) and `webhooks` (raw payloads) are implemented by hand on the server;
    every other tag is implemented through the generated interfaces.
servers:
  - url: /api/v1
tags:
  - name: settings
    description: Restaurant profile, branding, feature flags, VAT rates, stations
  - name: identity
    description: Authentication
  - name: users
    description: Staff user management
  - name: catalog
    description: Public menu
  - name: catalog-admin
    description: Categories, products and modifier management
  - name: ordering
    description: Orders and order tracking
  - name: kitchen
    description: Kitchen tickets per station
  - name: payments
    description: Online payments
  - name: notifications
    description: Push notification subscriptions
  - name: inventory
    description: Units, warehouses, stock items, FIFO ledger, stock documents, recipes
  - name: procurement
    description: Suppliers, purchase invoices (e-Factura import), NIR
  - name: streams
    description: Server-Sent Events (hand-implemented)
  - name: webhooks
    description: Payment provider webhooks (hand-implemented)

security:
  - bearerAuth: []

paths:
  # ---------------------------------------------------------------- settings
  /settings/public:
    get:
      tags: [settings]
      operationId: getPublicSettings
      summary: Branding, locales, feature flags and opening hours for client apps
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PublicSettings" }

  /admin/settings:
    get:
      tags: [settings]
      operationId: getRestaurantSettings
      summary: Full restaurant settings (ADMIN, MANAGER)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantSettings" }
        "403": { $ref: "#/components/responses/Problem" }
    put:
      tags: [settings]
      operationId: updateRestaurantSettings
      summary: Replace restaurant settings (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RestaurantSettings" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RestaurantSettings" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/vat-rates:
    get:
      tags: [settings]
      operationId: listVatRates
      summary: List VAT rates
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/VatRate" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [settings]
      operationId: createVatRate
      summary: Create a VAT rate (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VatRateRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatRate" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/vat-rates/{id}:
    put:
      tags: [settings]
      operationId: updateVatRate
      summary: Update a VAT rate (ADMIN)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/VatRateRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VatRate" }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/stations:
    get:
      tags: [settings]
      operationId: listStations
      summary: List preparation stations
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Station" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [settings]
      operationId: createStation
      summary: Create a station (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/stations/{id}:
    put:
      tags: [settings]
      operationId: updateStation
      summary: Update a station (ADMIN)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/StationRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Station" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- identity
  /auth/login:
    post:
      tags: [identity]
      operationId: login
      summary: Login with email and password
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      tags: [identity]
      operationId: refreshToken
      summary: Exchange a refresh token for new tokens (rotation; the old refresh token is revoked)
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "200":
          description: Tokens
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TokenResponse" }
        "401": { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [identity]
      operationId: logout
      summary: Revoke a refresh token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RefreshRequest" }
      responses:
        "204": { description: Revoked }
        "400": { $ref: "#/components/responses/Problem" }

  /me:
    get:
      tags: [identity]
      operationId: getCurrentUser
      summary: The authenticated user
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- users
  /admin/users:
    get:
      tags: [users]
      operationId: listUsers
      summary: List staff users (ADMIN)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/User" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [users]
      operationId: createUser
      summary: Create a staff user (ADMIN)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateUserRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/users/{id}:
    patch:
      tags: [users]
      operationId: updateUser
      summary: Update roles, name, locale, active flag or password (ADMIN)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateUserRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- catalog
  /menu:
    get:
      tags: [catalog]
      operationId: getMenu
      summary: Public menu (active categories with active products), localized
      security: []
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Menu" }

  /admin/categories:
    get:
      tags: [catalog-admin]
      operationId: listCategories
      summary: List all categories
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Category" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [catalog-admin]
      operationId: createCategory
      summary: Create a category
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/categories/{id}:
    put:
      tags: [catalog-admin]
      operationId: updateCategory
      summary: Update a category
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CategoryRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Category" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [catalog-admin]
      operationId: deleteCategory
      summary: Delete an empty category
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/products:
    get:
      tags: [catalog-admin]
      operationId: listProducts
      summary: List products
      parameters:
        - name: categoryId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Product" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [catalog-admin]
      operationId: createProduct
      summary: Create a product
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/products/{id}:
    get:
      tags: [catalog-admin]
      operationId: getProduct
      summary: Get a product
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Problem" }
    put:
      tags: [catalog-admin]
      operationId: updateProduct
      summary: Update a product
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Product" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [catalog-admin]
      operationId: deleteProduct
      summary: Archive a product (kept for order history)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Archived }
        "404": { $ref: "#/components/responses/Problem" }

  /admin/modifier-groups:
    get:
      tags: [catalog-admin]
      operationId: listModifierGroups
      summary: List modifier groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/AdminModifierGroup" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [catalog-admin]
      operationId: createModifierGroup
      summary: Create a modifier group with its options
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifierGroupRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModifierGroup" }
        "422": { $ref: "#/components/responses/Problem" }

  /admin/modifier-groups/{id}:
    put:
      tags: [catalog-admin]
      operationId: updateModifierGroup
      summary: Replace a modifier group and its options
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ModifierGroupRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AdminModifierGroup" }
        "404": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [catalog-admin]
      operationId: deleteModifierGroup
      summary: Delete a modifier group not used by any product
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Deleted }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- ordering
  /orders:
    post:
      tags: [ordering]
      operationId: createOrder
      summary: |
        Create an order. TAKEAWAY is public (guest checkout: name + phone required) and starts in PENDING_PAYMENT
        when online payments are enabled, otherwise PLACED. COUNTER and DINE_IN require a staff role and start PLACED.
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateOrderRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "422": { $ref: "#/components/responses/Problem" }
    get:
      tags: [ordering]
      operationId: listOrders
      summary: List recent orders (staff)
      parameters:
        - name: status
          in: query
          schema:
            type: array
            items: { $ref: "#/components/schemas/OrderStatus" }
          style: form
          explode: true
        - name: channel
          in: query
          schema: { $ref: "#/components/schemas/OrderChannel" }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Order" } }
        "403": { $ref: "#/components/responses/Problem" }

  /orders/{orderId}:
    get:
      tags: [ordering]
      operationId: getOrder
      summary: Get an order (staff, or anyone holding the tracking token)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/TrackingToken"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "404": { $ref: "#/components/responses/Problem" }

  /orders/{orderId}/complete:
    post:
      tags: [ordering]
      operationId: completeOrder
      summary: Mark a READY order as picked up / served (staff)
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Problem" }

  /orders/{orderId}/cancel:
    post:
      tags: [ordering]
      operationId: cancelOrder
      summary: Cancel an order with a reason (staff; PREPARING requires MANAGER)
      parameters: [{ $ref: "#/components/parameters/OrderId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CancelOrderRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "409": { $ref: "#/components/responses/Problem" }

  /queue:
    get:
      tags: [ordering]
      operationId: getQueueBoard
      summary: Order numbers currently preparing and ready (queue display)
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/QueueBoard" }

  # ---------------------------------------------------------------- kitchen
  /kitchen/tickets:
    get:
      tags: [kitchen]
      operationId: listKitchenTickets
      summary: Open tickets (QUEUED, IN_PROGRESS, recently READY), oldest first (KITCHEN, MANAGER, ADMIN)
      parameters:
        - name: stationId
          in: query
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/KitchenTicket" } }
        "403": { $ref: "#/components/responses/Problem" }

  /kitchen/tickets/{ticketId}/start:
    post:
      tags: [kitchen]
      operationId: startKitchenTicket
      summary: Start preparing a ticket
      parameters: [{ $ref: "#/components/parameters/TicketId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenTicket" }
        "409": { $ref: "#/components/responses/Problem" }

  /kitchen/tickets/{ticketId}/ready:
    post:
      tags: [kitchen]
      operationId: bumpKitchenTicket
      summary: Mark a ticket ready (bump)
      parameters: [{ $ref: "#/components/parameters/TicketId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenTicket" }
        "409": { $ref: "#/components/responses/Problem" }

  /kitchen/tickets/{ticketId}/recall:
    post:
      tags: [kitchen]
      operationId: recallKitchenTicket
      summary: Move a READY ticket back to IN_PROGRESS
      parameters: [{ $ref: "#/components/parameters/TicketId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/KitchenTicket" }
        "409": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- payments
  /orders/{orderId}/payment-intent:
    post:
      tags: [payments]
      operationId: createPaymentIntent
      summary: Start (or resume) online payment for a PENDING_PAYMENT order
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/TrackingToken"
      responses:
        "200":
          description: Client parameters for the provider SDK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentIntent" }
        "409": { $ref: "#/components/responses/Problem" }

  /payments/{paymentId}/simulate-capture:
    post:
      tags: [payments]
      operationId: simulatePaymentCapture
      summary: Dev only (PAYMENT_PROVIDER=fake) — simulate a successful provider capture
      security: []
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "204": { description: Captured }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- notifications
  /orders/{orderId}/push-subscriptions:
    post:
      tags: [notifications]
      operationId: registerPushSubscription
      summary: Register an Expo push token to be notified when the order is ready (customer app)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/TrackingToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PushSubscriptionRequest" }
      responses:
        "204": { description: Registered }
        "404": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- streams (hand-implemented)
  /orders/{orderId}/events:
    get:
      tags: [streams]
      operationId: streamOrderEvents
      summary: Server-Sent Events with status changes of one order (customer tracking)
      security: [{}, { bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/OrderId"
        - $ref: "#/components/parameters/TrackingToken"
      responses:
        "200":
          description: "Event stream; event name `order-status`, data OrderStatusChanged"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/OrderStatusChanged" }
        "404": { $ref: "#/components/responses/Problem" }

  /queue/events:
    get:
      tags: [streams]
      operationId: streamQueueEvents
      summary: Server-Sent Events for the queue display
      security: []
      responses:
        "200":
          description: "Event stream; event name `queue`, data QueueBoard"
          content:
            text/event-stream:
              schema: { $ref: "#/components/schemas/QueueBoard" }

  # ---------------------------------------------------------------- webhooks (hand-implemented)
  /payments/webhooks/stripe:
    post:
      tags: [webhooks]
      operationId: stripeWebhook
      summary: Stripe webhook (signature verified with STRIPE_WEBHOOK_SECRET)
      security: []
      parameters:
        - name: Stripe-Signature
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "200": { description: Accepted }
        "400": { $ref: "#/components/responses/Problem" }

  # ---------------------------------------------------------------- inventory
  /admin/units:
    get:
      tags: [inventory]
      operationId: listMeasureUnits
      summary: Units of measure (reference unit per dimension + conversion factors)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/MeasureUnit" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [inventory]
      operationId: createMeasureUnit
      summary: Create a unit (factor relative to the dimension's reference unit)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasureUnitRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasureUnit" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/units/{id}:
    put:
      tags: [inventory]
      operationId: updateMeasureUnit
      summary: Update a unit; mapping an UNMAPPED unit (from an invoice) sets its dimension and factor
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeasureUnitRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MeasureUnit" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/warehouses:
    get:
      tags: [inventory]
      operationId: listWarehouses
      summary: List warehouses (gestiuni)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Warehouse" } }
        "403": { $ref: "#/components/responses/Problem" }
    post:
      tags: [inventory]
      operationId: createWarehouse
      summary: Create a warehouse
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WarehouseRequest" }
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Warehouse" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/warehouses/{id}:
    put:
      tags: [inventory]
      operationId: updateWarehouse
      summary: Update a warehouse
