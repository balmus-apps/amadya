  /admin/nirs/{id}/post:
    post:
      tags: [procurement]
      operationId: postNir
      summary: Post the NIR — stock is received as FIFO lots; the NIR becomes immutable
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Posted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nir" }
        "409": { $ref: "#/components/responses/Problem" }

  /admin/nirs/{id}/reverse:
    post:
      tags: [procurement]
      operationId: reverseNir
      summary: Post a reversing NIR (only while the received lots are unconsumed)
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: The reversing NIR
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Nir" }
        "409": { $ref: "#/components/responses/Problem" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      schema: { type: string, examples: [ro, en] }
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    OrderId:
      name: orderId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TicketId:
      name: ticketId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TrackingToken:
      name: token
      in: query
      description: Per-order tracking token returned when the order is created (not needed for staff)
      schema: { type: string }

  responses:
    Problem:
      description: Error (RFC 9457)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    # ---------------------------------------------------------- common
    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string, description: Stable machine-readable error code }
        errors:
          type: array
          items:
            type: object
            properties:
              field: { type: string }
              message: { type: string }

    Money:
      type: object
      required: [amount, currency]
      properties:
        amount: { type: string, pattern: '^-?\d+(\.\d{1,2})?$', examples: ["20.00"] }
        currency: { type: string, examples: [RON] }

    LocalizedText:
      type: object
      description: Text in each supported locale; `ro` is required
      required: [ro]
      properties:
        ro: { type: string, minLength: 1 }
        en: { type: string }

    Locale:
      type: string
      enum: [ro, en]

    # ---------------------------------------------------------- settings
    Features:
      type: object
      required: [takeaway, tables, onlinePayments, kitchenDisplay, queueDisplay, invoiceOcr]
      properties:
        takeaway: { type: boolean }
        tables: { type: boolean }
        onlinePayments: { type: boolean }
        kitchenDisplay: { type: boolean }
        queueDisplay: { type: boolean }
        invoiceOcr: { type: boolean }

    OpeningHours:
      type: object
      required: [dayOfWeek, opens, closes]
      properties:
        dayOfWeek: { type: integer, minimum: 1, maximum: 7, description: "1 = Monday" }
        opens: { type: string, pattern: '^\d{2}:\d{2}$', examples: ["10:00"] }
        closes: { type: string, pattern: '^\d{2}:\d{2}$', examples: ["22:00"] }

    PublicSettings:
      type: object
      required: [name, defaultLocale, locales, currency, theme, features, openingHours]
      properties:
        name: { type: string }
        logoUrl: { type: string }
        phone: { type: string }
        address: { type: string }
        defaultLocale: { $ref: "#/components/schemas/Locale" }
        locales: { type: array, items: { $ref: "#/components/schemas/Locale" } }
        currency: { type: string }
        theme:
          type: object
          additionalProperties: { type: string }
          description: Design tokens, e.g. {"primary":"#FFC800","radius":"12px"}
        features: { $ref: "#/components/schemas/Features" }
        openingHours: { type: array, items: { $ref: "#/components/schemas/OpeningHours" } }

    RestaurantSettings:
      type: object
      required: [name, defaultLocale, locales, currency, theme, features, openingHours]
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        legalName: { type: string, maxLength: 200 }
        cui: { type: string, maxLength: 20, description: Romanian fiscal code }
        regCom: { type: string, maxLength: 40 }
        address: { type: string, maxLength: 300 }
        phone: { type: string, maxLength: 30 }
        email: { type: string, format: email }
        logoUrl: { type: string, maxLength: 500 }
        defaultLocale: { $ref: "#/components/schemas/Locale" }
        locales: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Locale" } }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
        theme:
          type: object
          additionalProperties: { type: string }
        features: { $ref: "#/components/schemas/Features" }
        openingHours: { type: array, items: { $ref: "#/components/schemas/OpeningHours" } }
        orderNumberPrefix: { type: string, maxLength: 3, examples: [A] }

    VatRate:
      type: object
      required: [id, code, name, percent, fiscalGroup, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [STD] }
        name: { $ref: "#/components/schemas/LocalizedText" }
        percent: { type: string, pattern: '^\d{1,2}(\.\d{1,2})?$', examples: ["21.00"] }
        fiscalGroup: { type: string, description: "Fiscal printer VAT group letter, examples: [A]" }
        active: { type: boolean }

    VatRateRequest:
      type: object
      required: [code, name, percent, fiscalGroup]
      properties:
        code: { type: string, minLength: 1, maxLength: 10 }
        name: { $ref: "#/components/schemas/LocalizedText" }
        percent: { type: string, pattern: '^\d{1,2}(\.\d{1,2})?$' }
        fiscalGroup: { type: string, minLength: 1, maxLength: 2 }
        active: { type: boolean, default: true }

    Station:
      type: object
      required: [id, code, name, parallelSlots, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [GRILL] }
        name: { $ref: "#/components/schemas/LocalizedText" }
        parallelSlots: { type: integer, description: How many tickets the station prepares at the same time }
        active: { type: boolean }

    StationRequest:
      type: object
      required: [code, name]
      properties:
        code: { type: string, minLength: 1, maxLength: 20, pattern: '^[A-Z0-9_]+$' }
        name: { $ref: "#/components/schemas/LocalizedText" }
        parallelSlots: { type: integer, minimum: 1, maximum: 50, default: 2 }
        active: { type: boolean, default: true }

    # ---------------------------------------------------------- identity
    Role:
      type: string
      enum: [ADMIN, MANAGER, WAITER, KITCHEN, CASHIER, CUSTOMER]

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password, minLength: 1 }

    RefreshRequest:
      type: object
      required: [refreshToken]
      properties:
        refreshToken: { type: string, minLength: 1 }

    TokenResponse:
      type: object
      required: [accessToken, refreshToken, expiresIn, tokenType]
      properties:
        accessToken: { type: string }
        refreshToken: { type: string }
        tokenType: { type: string, examples: [Bearer] }
        expiresIn: { type: integer, description: Access token lifetime in seconds }

    User:
      type: object
      required: [id, email, name, roles, locale, active]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        name: { type: string }
        phone: { type: string }
        roles: { type: array, items: { $ref: "#/components/schemas/Role" } }
        locale: { $ref: "#/components/schemas/Locale" }
        active: { type: boolean }

    CreateUserRequest:
      type: object
      required: [email, name, password, roles]
      properties:
        email: { type: string, format: email }
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Role" } }
        locale: { $ref: "#/components/schemas/Locale" }

    UpdateUserRequest:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        password: { type: string, format: password, minLength: 10, maxLength: 128 }
        roles: { type: array, minItems: 1, items: { $ref: "#/components/schemas/Role" } }
        locale: { $ref: "#/components/schemas/Locale" }
        active: { type: boolean }

    # ---------------------------------------------------------- catalog (public)
    Menu:
      type: object
      required: [categories, promotions]
      properties:
        promotions:
          type: array
          description: Active promotional banners, in display order
          items: { $ref: "#/components/schemas/MenuPromotion" }
        categories:
          type: array
          items: { $ref: "#/components/schemas/MenuCategory" }

    MenuPromotion:
      type: object
      required: [id, title]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        subtitle: { type: string }
        badge: { type: string, examples: ["20 LEI"] }
        imageUrl: { type: string }
        productId: { type: string, format: uuid, description: Product opened when the banner is tapped }

    MenuCategory:
      type: object
      required: [id, name, products]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        products:
          type: array
          items: { $ref: "#/components/schemas/MenuProduct" }

    MenuProduct:
      type: object
      required: [id, name, price, available, modifierGroups, allergens]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        available: { type: boolean }
        prepTimeSec: { type: integer }
        allergens: { type: array, items: { type: string } }
        modifierGroups:
          type: array
          items: { $ref: "#/components/schemas/MenuModifierGroup" }

    MenuModifierGroup:
      type: object
      required: [id, name, minSelect, maxSelect, options]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ["Sos"] }
        minSelect: { type: integer, minimum: 0 }
        maxSelect: { type: integer, minimum: 1 }
        options:
          type: array
          items: { $ref: "#/components/schemas/MenuModifierOption" }

    MenuModifierOption:
      type: object
      required: [id, name, priceDelta]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, examples: ["Sos cheese", "Sos usturoi"] }
        priceDelta: { $ref: "#/components/schemas/Money" }

    # ---------------------------------------------------------- catalog (admin)
    Category:
      type: object
      required: [id, name, sortOrder, active]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/LocalizedText" }
        sortOrder: { type: integer }
        active: { type: boolean }

    CategoryRequest:
      type: object
      required: [name]
      properties:
        name: { $ref: "#/components/schemas/LocalizedText" }
        sortOrder: { type: integer, default: 0 }
        active: { type: boolean, default: true }

    ProductKind:
      type: string
      enum: [RECIPE, RESALE, SERVICE]

    Product:
      type: object
      required: [id, categoryId, name, price, vatRateId, kind, prepTimeSec, available, archived, sortOrder, allergens, modifierGroupIds]
      properties:
        id: { type: string, format: uuid }
        categoryId: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string }
        price: { $ref: "#/components/schemas/Money" }
        vatRateId: { type: string, format: uuid }
        stationId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/ProductKind" }
        prepTimeSec: { type: integer }
        available: { type: boolean, description: Temporarily sold out when false }
        archived: { type: boolean }
        sortOrder: { type: integer }
        allergens: { type: array, items: { type: string } }
        modifierGroupIds: { type: array, items: { type: string, format: uuid } }

    ProductRequest:
      type: object
      required: [categoryId, name, price, vatRateId]
      properties:
        categoryId: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/LocalizedText" }
        description: { $ref: "#/components/schemas/LocalizedText" }
        imageUrl: { type: string, maxLength: 500 }
        price: { type: string, pattern: '^\d{1,8}(\.\d{1,2})?$', description: Gross price (VAT included) }
        vatRateId: { type: string, format: uuid }
        stationId: { type: string, format: uuid, description: Required when the product needs preparation }
        kind: { $ref: "#/components/schemas/ProductKind" }
        prepTimeSec: { type: integer, minimum: 0, maximum: 7200, default: 300 }
        available: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }
        allergens: { type: array, items: { type: string, maxLength: 40 } }
        modifierGroupIds: { type: array, items: { type: string, format: uuid } }

    AdminModifierGroup:
      type: object
      required: [id, name, minSelect, maxSelect, options]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/LocalizedText" }
        minSelect: { type: integer }
        maxSelect: { type: integer }
        options:
          type: array
          items: { $ref: "#/components/schemas/AdminModifierOption" }

    AdminModifierOption:
      type: object
      required: [id, name, priceDelta, available, sortOrder]
      properties:
        id: { type: string, format: uuid }
        name: { $ref: "#/components/schemas/LocalizedText" }
        priceDelta: { $ref: "#/components/schemas/Money" }
        available: { type: boolean }
        sortOrder: { type: integer }

    ModifierGroupRequest:
      type: object
      required: [name, minSelect, maxSelect, options]
      properties:
        name: { $ref: "#/components/schemas/LocalizedText" }
        minSelect: { type: integer, minimum: 0, maximum: 20 }
        maxSelect: { type: integer, minimum: 1, maximum: 20 }
        options:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/ModifierOptionRequest" }

    ModifierOptionRequest:
      type: object
      required: [name]
      properties:
        id: { type: string, format: uuid, description: Existing option id to keep it stable; omitted for new options }
        name: { $ref: "#/components/schemas/LocalizedText" }
        priceDelta: { type: string, pattern: '^-?\d{1,6}(\.\d{1,2})?$', default: "0" }
        available: { type: boolean, default: true }
        sortOrder: { type: integer, default: 0 }

    # ---------------------------------------------------------- ordering
    OrderChannel:
      type: string
      enum: [TAKEAWAY, DINE_IN, COUNTER]

    OrderStatus:
      type: string
      enum: [PENDING_PAYMENT, PLACED, PREPARING, READY, COMPLETED, CANCELLED]

    PaymentStatus:
      type: string
      enum: [UNPAID, PAID, REFUNDED]

    CustomerContact:
      type: object
      required: [name, phone]
      properties:
        name: { type: string, minLength: 2, maxLength: 80 }
        phone: { type: string, pattern: '^\+[1-9]\d{7,14}$', description: "E.164, e.g. +40722123456" }
        email: { type: string, format: email }

    CreateOrderRequest:
      type: object
      required: [channel, lines]
      properties:
        channel: { $ref: "#/components/schemas/OrderChannel" }
        tableSessionId: { type: string, format: uuid }
        pickupAt: { type: string, format: date-time, description: Requested pickup time (TAKEAWAY); omitted = as soon as possible }
        customer: { $ref: "#/components/schemas/CustomerContact" }
        notes: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/CreateOrderLine" }

    CreateOrderLine:
      type: object
      required: [productId, quantity]
      properties:
        productId: { type: string, format: uuid }
        quantity: { type: integer, minimum: 1, maximum: 99 }
        notes: { type: string, maxLength: 200 }
        modifierOptionIds:
          type: array
          maxItems: 50
          items: { type: string, format: uuid }

    OrderLine:
      type: object
      required: [id, productId, productName, quantity, unitPrice, modifiers, total]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        quantity: { type: integer }
        unitPrice: { $ref: "#/components/schemas/Money" }
        modifiers: { type: array, items: { type: string } }
        notes: { type: string }
        total: { $ref: "#/components/schemas/Money" }

    Order:
      type: object
      required: [id, number, channel, status, paymentStatus, lines, total, vatTotal, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ["A-042"] }
        channel: { $ref: "#/components/schemas/OrderChannel" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        paymentStatus: { $ref: "#/components/schemas/PaymentStatus" }
        customer: { $ref: "#/components/schemas/CustomerContact" }
        tableSessionId: { type: string, format: uuid }
        pickupAt: { type: string, format: date-time }
        estimatedReadyAt: { type: string, format: date-time }
        notes: { type: string }
        cancelReason: { type: string }
        trackingToken: { type: string, description: Returned only on create }
        lines:
          type: array
          items: { $ref: "#/components/schemas/OrderLine" }
        total: { $ref: "#/components/schemas/Money" }
        vatTotal: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    CancelOrderRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 3, maxLength: 300 }

    OrderStatusChanged:
      type: object
      required: [orderId, number, status, at]
      properties:
        orderId: { type: string, format: uuid }
        number: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        estimatedReadyAt: { type: string, format: date-time }
        at: { type: string, format: date-time }

    QueueBoard:
      type: object
      required: [preparing, ready]
      properties:
        preparing: { type: array, items: { type: string }, description: Order numbers (PLACED or PREPARING) }
        ready: { type: array, items: { type: string }, description: Order numbers that are READY }

    # ---------------------------------------------------------- kitchen
    KitchenTicketStatus:
      type: string
      enum: [QUEUED, IN_PROGRESS, READY]

    KitchenTicket:
      type: object
      required: [id, orderId, orderNumber, channel, stationId, status, queuedAt, estimatedReadyAt, lines]
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid }
        orderNumber: { type: string }
        channel: { $ref: "#/components/schemas/OrderChannel" }
        stationId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/KitchenTicketStatus" }
        queuedAt: { type: string, format: date-time }
        startedAt: { type: string, format: date-time }
        readyAt: { type: string, format: date-time }
        estimatedReadyAt: { type: string, format: date-time }
        notes: { type: string }
        lines:
          type: array
          items: { $ref: "#/components/schemas/KitchenTicketLine" }

    KitchenTicketLine:
      type: object
      required: [productName, quantity, modifiers]
      properties:
        productName: { type: string }
        quantity: { type: integer }
        modifiers: { type: array, items: { type: string } }
        notes: { type: string }

    # ---------------------------------------------------------- notifications
    PushSubscriptionRequest:
      type: object
      required: [expoPushToken]
      properties:
        expoPushToken: { type: string, pattern: '^Expo(nent)?PushToken\[.+\]$', maxLength: 200, examples: ["ExponentPushToken[xxxxxxxxxxxxxxxxxxxxxx]"] }
        locale: { $ref: "#/components/schemas/Locale" }

    # ---------------------------------------------------------- payments
    PaymentIntent:
      type: object
      required: [paymentId, provider, amount]
      properties:
        paymentId: { type: string, format: uuid }
        provider: { type: string, enum: [stripe, fake] }
        clientSecret: { type: string, description: Stripe PaymentIntent client secret }
        publishableKey: { type: string }
        amount: { $ref: "#/components/schemas/Money" }

    # ---------------------------------------------------------- inventory
    Quantity:
      type: string
      pattern: '^-?\d{1,9}(\.\d{1,3})?$'
      description: Decimal quantity, up to 3 decimals
      examples: ["2.500"]

    Dimension:
      type: string
      enum: [MASS, VOLUME, COUNT, LENGTH]

    UnitStatus:
      type: string
      enum: [ACTIVE, UNMAPPED]

    MeasureUnit:
      type: object
      required: [id, code, name, factor, isReference, aliases, status]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: [kg] }
        name: { $ref: "#/components/schemas/LocalizedText" }
        dimension: { $ref: "#/components/schemas/Dimension" }
        factor: { type: string, description: How many reference units one unit equals (kg = 1000) }
        isReference: { type: boolean }
        aliases: { type: array, items: { type: string } }
        status: { $ref: "#/components/schemas/UnitStatus" }

    MeasureUnitRequest:
      type: object
      required: [code, name, dimension, factor]
      properties:
        code: { type: string, minLength: 1, maxLength: 12 }
        name: { $ref: "#/components/schemas/LocalizedText" }
        dimension: { $ref: "#/components/schemas/Dimension" }
        factor: { type: string, pattern: '^\d{1,12}(\.\d{1,6})?$' }
        aliases: { type: array, items: { type: string, maxLength: 30 } }

    WarehouseType:
      type: string
      enum: [INGREDIENTS, FINISHED_GOODS, FIXED_ASSETS, CONSUMABLES]

    Warehouse:
      type: object
      required: [id, code, name, type, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string }
        name: { $ref: "#/components/schemas/LocalizedText" }
        type: { $ref: "#/components/schemas/WarehouseType" }
        active: { type: boolean }

    WarehouseRequest:
      type: object
      required: [code, name, type]
      properties:
        code: { type: string, minLength: 1, maxLength: 20, pattern: '^[A-Z0-9_]+$' }
        name: { $ref: "#/components/schemas/LocalizedText" }
        type: { $ref: "#/components/schemas/WarehouseType" }
        active: { type: boolean, default: true }

    Packaging:
      type: object
      required: [name, qtyInBase]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, minLength: 1, maxLength: 40, examples: ["bax 24"] }
        qtyInBase: { $ref: "#/components/schemas/Quantity" }
        barcode: { type: string, maxLength: 40 }

    StockItem:
      type: object
      required: [id, sku, name, type, baseUnitId, baseUnitCode, minStock, active, packagings, quantityOnHand]
      properties:
        id: { type: string, format: uuid }
        sku: { type: string }
        name: { $ref: "#/components/schemas/LocalizedText" }
        type: { $ref: "#/components/schemas/WarehouseType" }
        baseUnitId: { type: string, format: uuid, description: "Reference unit of the item's dimension (g, ml, buc)" }
        baseUnitCode: { type: string }
        displayUnitId: { type: string, format: uuid }
        defaultWarehouseId: { type: string, format: uuid }
        minStock: { $ref: "#/components/schemas/Quantity" }
        active: { type: boolean }
        packagings: { type: array, items: { $ref: "#/components/schemas/Packaging" } }
        quantityOnHand: { $ref: "#/components/schemas/Quantity" }

    StockItemRequest:
      type: object
      required: [sku, name, type, dimension]
      properties:
        sku: { type: string, minLength: 1, maxLength: 40 }
        name: { $ref: "#/components/schemas/LocalizedText" }
        type: { $ref: "#/components/schemas/WarehouseType" }
        dimension: { $ref: "#/components/schemas/Dimension" }
        displayUnitId: { type: string, format: uuid }
        defaultWarehouseId: { type: string, format: uuid }
        minStock: { $ref: "#/components/schemas/Quantity" }
        active: { type: boolean, default: true }
        packagings: { type: array, items: { $ref: "#/components/schemas/Packaging" } }

    StockBalance:
      type: object
      required: [warehouseId, stockItemId, sku, itemName, quantity, unitCode, value, minStock, low]
      properties:
        warehouseId: { type: string, format: uuid }
        stockItemId: { type: string, format: uuid }
        sku: { type: string }
        itemName: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string }
        value: { $ref: "#/components/schemas/Money" }
        minStock: { $ref: "#/components/schemas/Quantity" }
        low: { type: boolean }

    StockMovementType:
      type: string
      enum: [RECEIPT_NIR, CONSUMPTION_SALE, RETURN_SALE, TRANSFER_OUT, TRANSFER_IN, CONSUMPTION_NOTE, WASTE, COUNT_LOSS, COUNT_GAIN, REVERSAL]

    StockMovement:
      type: object
      required: [id, warehouseId, stockItemId, itemName, type, quantity, unitCode, cost, occurredAt]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        stockItemId: { type: string, format: uuid }
        itemName: { type: string }
        type: { $ref: "#/components/schemas/StockMovementType" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string }
        cost: { $ref: "#/components/schemas/Money" }
        sourceType: { type: string, examples: [NIR, ORDER, DOCUMENT] }
        sourceId: { type: string, format: uuid }
        sourceRef: { type: string, description: "Human reference, e.g. NIR-2026-000012 or order B-014" }
        occurredAt: { type: string, format: date-time }

    StockLot:
      type: object
      required: [id, warehouseId, stockItemId, receivedAt, quantityInitial, quantityRemaining, unitCost, unitCode]
      properties:
        id: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        stockItemId: { type: string, format: uuid }
        receivedAt: { type: string, format: date-time }
        quantityInitial: { $ref: "#/components/schemas/Quantity" }
        quantityRemaining: { $ref: "#/components/schemas/Quantity" }
        unitCost: { type: string, description: Cost per base unit (6 decimals) }
        unitCode: { type: string }

    StockDocumentType:
      type: string
      enum: [TRANSFER, CONSUMPTION, WASTE, COUNT]

    StockDocumentLineRequest:
      type: object
      required: [stockItemId, quantity]
      properties:
        stockItemId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitId: { type: string, format: uuid, description: Unit of `quantity`; defaults to the item's base unit }
        packagingId: { type: string, format: uuid, description: Alternative to unitId }
        reason: { type: string, maxLength: 200 }

    StockDocumentRequest:
      type: object
      required: [type, warehouseId, lines]
      properties:
        type: { $ref: "#/components/schemas/StockDocumentType" }
        date: { type: string, format: date }
        warehouseId: { type: string, format: uuid, description: Source warehouse (counted warehouse for COUNT) }
        targetWarehouseId: { type: string, format: uuid, description: Required for TRANSFER }
        note: { type: string, maxLength: 500 }
        lines:
          type: array
          minItems: 1
          description: For COUNT, `quantity` is the counted quantity
          items: { $ref: "#/components/schemas/StockDocumentLineRequest" }

    StockDocumentLine:
      type: object
      required: [stockItemId, itemName, quantity, unitCode]
      properties:
        stockItemId: { type: string, format: uuid }
        itemName: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string }
        systemQuantity: { $ref: "#/components/schemas/Quantity" }
        difference: { $ref: "#/components/schemas/Quantity" }
        cost: { $ref: "#/components/schemas/Money" }
        reason: { type: string }

    StockDocument:
      type: object
      required: [id, number, type, date, warehouseId, lines, totalCost, createdAt]
      properties:
        id: { type: string, format: uuid }
        number: { type: string, examples: ["TR-2026-000004"] }
        type: { $ref: "#/components/schemas/StockDocumentType" }
        date: { type: string, format: date }
        warehouseId: { type: string, format: uuid }
        targetWarehouseId: { type: string, format: uuid }
        note: { type: string }
        lines: { type: array, items: { $ref: "#/components/schemas/StockDocumentLine" } }
        totalCost: { $ref: "#/components/schemas/Money" }
        createdAt: { type: string, format: date-time }

    RecipeLineRequest:
      type: object
      required: [stockItemId, quantity]
      properties:
        stockItemId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitId: { type: string, format: uuid, description: Unit of `quantity`; defaults to the item's base unit }
        warehouseId: { type: string, format: uuid, description: Defaults to the item's default warehouse }

    RecipeRequest:
      type: object
      required: [lines]
      properties:
        lines: { type: array, items: { $ref: "#/components/schemas/RecipeLineRequest" } }

    RecipeLine:
      type: object
      required: [stockItemId, itemName, quantity, unitCode]
      properties:
        stockItemId: { type: string, format: uuid }
        itemName: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string, description: Base unit of the item }
        warehouseId: { type: string, format: uuid }
        estimatedCost: { $ref: "#/components/schemas/Money" }

    Recipe:
      type: object
      required: [lines]
      properties:
        productId: { type: string, format: uuid }
        optionId: { type: string, format: uuid }
        lines: { type: array, items: { $ref: "#/components/schemas/RecipeLine" } }
        estimatedCost: { $ref: "#/components/schemas/Money", description: Current FIFO cost of one portion }

    # ---------------------------------------------------------- procurement
    Supplier:
      type: object
      required: [id, name, active]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        cui: { type: string }
        regCom: { type: string }
        address: { type: string }
        iban: { type: string }
        email: { type: string }
        phone: { type: string }
        active: { type: boolean }

    SupplierRequest:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        cui: { type: string, maxLength: 20 }
        regCom: { type: string, maxLength: 40 }
        address: { type: string, maxLength: 300 }
        iban: { type: string, maxLength: 34 }
        email: { type: string, maxLength: 120 }
        phone: { type: string, maxLength: 30 }
        active: { type: boolean, default: true }

    InvoiceSource:
      type: string
      enum: [MANUAL, EFACTURA_XML, SCAN]

    PurchaseInvoiceLine:
      type: object
      required: [id, position, description, quantity, unitCode, unitPrice, vatPercent, lineNet]
      properties:
        id: { type: string, format: uuid }
        position: { type: integer }
        supplierCode: { type: string }
        description: { type: string }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string, description: "As written on the invoice (e.g. KGM, kg, BAX)" }
        unitId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid }
        unitPrice: { type: string, description: Net unit price }
        vatPercent: { type: string }
        lineNet: { type: string }
        stockItemId: { type: string, format: uuid }
        matched: { type: boolean, description: True when stock item and a convertible unit are known }

    PurchaseInvoice:
      type: object
      required: [id, supplierId, supplierName, number, issueDate, currency, totalNet, totalVat, totalGross, source, lines]
      properties:
        id: { type: string, format: uuid }
        supplierId: { type: string, format: uuid }
        supplierName: { type: string }
        series: { type: string }
        number: { type: string }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string }
        totalNet: { type: string }
        totalVat: { type: string }
        totalGross: { type: string }
        source: { $ref: "#/components/schemas/InvoiceSource" }
        nirId: { type: string, format: uuid, description: "NIR created from this invoice, if any" }
        lines: { type: array, items: { $ref: "#/components/schemas/PurchaseInvoiceLine" } }

    PurchaseInvoiceLineRequest:
      type: object
      required: [description, quantity, unitPrice, vatPercent]
      properties:
        supplierCode: { type: string, maxLength: 60 }
        description: { type: string, minLength: 1, maxLength: 300 }
        quantity: { $ref: "#/components/schemas/Quantity" }
        unitCode: { type: string, maxLength: 20 }
        unitId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid }
        unitPrice: { type: string, pattern: '^\d{1,9}(\.\d{1,6})?$' }
        vatPercent: { type: string, pattern: '^\d{1,2}(\.\d{1,2})?$' }
        stockItemId: { type: string, format: uuid }

    PurchaseInvoiceRequest:
      type: object
      required: [supplierId, number, issueDate, lines]
      properties:
        supplierId: { type: string, format: uuid }
        series: { type: string, maxLength: 20 }
        number: { type: string, minLength: 1, maxLength: 40 }
        issueDate: { type: string, format: date }
        dueDate: { type: string, format: date }
        currency: { type: string, pattern: '^[A-Z]{3}$', default: RON }
        lines: { type: array, minItems: 1, items: { $ref: "#/components/schemas/PurchaseInvoiceLineRequest" } }

    InvoiceLineMatchRequest:
      type: object
      required: [stockItemId]
      properties:
        stockItemId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid }
        remember: { type: boolean, default: true, description: Remember this supplier code/description for future invoices }

    NirStatus:
      type: string
      enum: [DRAFT, POSTED, REVERSED]

    NirLineRequest:
      type: object
      required: [stockItemId, quantityDocument, quantityReceived, unitPrice]
      properties:
        stockItemId: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid }
        quantityDocument: { $ref: "#/components/schemas/Quantity" }
        quantityReceived: { $ref: "#/components/schemas/Quantity" }
        unitPrice: { type: string, pattern: '^\d{1,9}(\.\d{1,6})?$', description: Net purchase price per unit of the line }
        vatPercent: { type: string, pattern: '^\d{1,2}(\.\d{1,2})?$' }
        discrepancyReason: { type: string, maxLength: 200 }

    NirRequest:
      type: object
      required: [warehouseId]
      properties:
        invoiceId: { type: string, format: uuid, description: "Prefill supplier, references and lines from this invoice (create only)" }
