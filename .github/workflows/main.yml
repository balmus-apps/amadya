# Builds the Amadya images for the server (linux/amd64) and pushes them to GitHub Container Registry, the same as
# scripts/release.sh. The server only pulls; it never builds (1 vCPU, 2 GB).
#
# Run it from GitHub: Actions → Release → Run workflow (branch: main). Each image is tagged with the short commit sha
# and "latest". Then on the server:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml pull
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --no-build
name: Release

on:
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN may push to ghcr.io/balmus-apps: no secret to set up.
  packages: write

# Two releases at once would race for the "latest" tags.
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/balmus-apps

jobs:
  image:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., dockerfile: backend/Dockerfile }
          - { name: menu-web, context: frontend, dockerfile: frontend/apps/menu-web/Dockerfile }
          - { name: admin, context: frontend, dockerfile: frontend/apps/admin/Dockerfile }
          - { name: kitchen, context: frontend, dockerfile: frontend/apps/kitchen/Dockerfile }
          - { name: waiter, context: frontend, dockerfile: frontend/apps/waiter/Dockerfile }
          - { name: queue-display, context: frontend, dockerfile: frontend/apps/queue-display/Dockerfile }
          - { name: table, context: frontend, dockerfile: frontend/apps/table/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Same tag as release.sh (git rev-parse --short HEAD), so AMADYA_TAG works with either.
      - id: tag
        run: echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/amadya-${{ matrix.name }}:${{ steps.tag.outputs.sha }}
            ${{ env.REGISTRY }}/amadya-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/balmus-apps/amadya
            org.opencontainers.image.revision=${{ github.sha }}
          # Per-image build cache in GitHub Actions: later releases only rebuild what changed.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
