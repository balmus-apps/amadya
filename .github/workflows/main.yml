# Release: builds the Amadya images (linux/amd64) and pushes them to GitHub Container Registry (ADR 0012,
# docs/deploy.md). It does not deploy: automatic deploys are out of scope for now; the server is updated by hand with
# scripts/deploy.sh <tag>. The server only pulls; it never builds (1 vCPU, 2 GB).
#
# - Every push to main builds that commit; documentation-only pushes do not.
# - Actions → Release → Run workflow builds the chosen branch on demand.
#
# Images are tagged with the first 7 characters of the commit sha (as scripts/release.sh does) and "latest".
name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "openspec/**"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read
  # GITHUB_TOKEN may push to ghcr.io/balmus-apps: no secret to set up.
  packages: write

# One release at a time: a second run waits (builds race for "latest").
concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io/balmus-apps

jobs:
  meta:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

  image:
    name: ${{ matrix.name }}
    needs: meta
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: api, context: ., dockerfile: backend/Dockerfile }
          - { name: menu-web, context: frontend, dockerfile: frontend/apps/menu-web/Dockerfile }
          - { name: admin, context: frontend, dockerfile: frontend/apps/admin/Dockerfile }
          - { name: kitchen, context: frontend, dockerfile: frontend/apps/kitchen/Dockerfile }
          - { name: waiter, context: frontend, dockerfile: frontend/apps/waiter/Dockerfile }
          - { name: cashier, context: frontend, dockerfile: frontend/apps/cashier/Dockerfile }
          - { name: queue-display, context: frontend, dockerfile: frontend/apps/queue-display/Dockerfile }
          - { name: table, context: frontend, dockerfile: frontend/apps/table/Dockerfile }
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.REGISTRY }}/amadya-${{ matrix.name }}:${{ needs.meta.outputs.tag }}
            ${{ env.REGISTRY }}/amadya-${{ matrix.name }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/balmus-apps/amadya
            org.opencontainers.image.revision=${{ github.sha }}
          # Per-image build cache in GitHub Actions: later releases only rebuild what changed.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
